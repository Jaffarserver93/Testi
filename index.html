<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Auth Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/auth.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card" aria-live="polite">
        <header class="brand">
          <div class="logo" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <p>Spotify</p>
        </header>

        <section id="signupView" class="view active" data-view="signup">
          <h1>Sign up to start listening</h1>
          <form class="form-stack" id="signupForm" novalidate>
            <label>
              Email address
              <input name="email" type="email" placeholder="name@domain.com" required />
            </label>
            <label>
              Password
              <input
                name="password"
                type="password"
                placeholder="Create a password"
                minlength="8"
                required
              />
            </label>
            <label>
              What should we call you?
              <input name="displayName" type="text" placeholder="Display name" required />
            </label>
            <button class="primary" type="submit">Sign up</button>
          </form>
          <p class="meta">
            Already have an account?
            <button class="link" type="button" data-target="login">Log in</button>
          </p>
        </section>

        <section id="loginView" class="view" data-view="login">
          <h1>Log in to Spotify</h1>
          <form class="form-stack" id="loginForm" novalidate>
            <label>
              Email or username
              <input name="identity" type="text" placeholder="Email or username" required />
            </label>
            <label>
              Password
              <input name="password" type="password" placeholder="Password" required />
            </label>
            <label class="checkbox">
              <input name="remember" type="checkbox" />
              Remember me
            </label>
            <button class="primary" type="submit">Log in</button>
          </form>
          <p class="meta">
            Don't have an account?
            <button class="link" type="button" data-target="signup">Sign up for Spotify</button>
          </p>
        </section>
      </section>
    </main>

    <script type="module" src="src/scripts/auth.js"></script>
  </body>
</html>
